name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Create Version Pull Request or Publish
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run version
          publish-script: npx changeset publish
          commit-message: "chore: version skills"
          pr-title: "chore: version skills"
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
